<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Monitor - Noob Server</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .monitor-container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .stat-card { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; }
        .online-users { background: #27ae60; }
        .active-sessions { background: #3498db; }
        .page-views { background: #e74c3c; }
        .refresh-btn { padding: 10px 20px; background: #007cba; color: white; border: none; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="monitor-container">
        <h1>Activity Monitor</h1>
        <button class="refresh-btn" onclick="refreshData()">Refresh Data</button>
        
        <div class="stats-grid">
            <div class="stat-card online-users">
                <h3>Online Users</h3>
                <div id="online-count">0</div>
                <div id="online-users-list"></div>
            </div>
            
            <div class="stat-card active-sessions">
                <h3>Active Sessions</h3>
                <div id="session-count">0</div>
                <div id="sessions-list"></div>
            </div>
            
            <div class="stat-card page-views">
                <h3>Current Page Views</h3>
                <div id="page-views-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is admin
        const username = sessionStorage.getItem('username');
        if (username !== 'admin') {
            alert('Access denied. Admin only.');
            window.location.href = '/';
        }

        async function refreshData() {
            try {
                const response = await fetch('/.netlify/functions/monitor', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    updateDisplay(data);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateDisplay(data) {
            document.getElementById('online-count').textContent = data.onlineUsers.length;
            document.getElementById('session-count').textContent = data.activeSessions.length;
            
            // Display online users
            const usersList = data.onlineUsers.map(user => 
                `<div>${user.username} - ${user.currentPage} (${user.lastSeen})</div>`
            ).join('');
            document.getElementById('online-users-list').innerHTML = usersList;
            
            // Display page views
            const pageViews = Object.entries(data.pageViews).map(([page, count]) => 
                `<div>${page}: ${count} users</div>`
            ).join('');
            document.getElementById('page-views-list').innerHTML = pageViews;
        }

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);
        
        // Initial load
        refreshData();
    </script>
</body>
</html>
