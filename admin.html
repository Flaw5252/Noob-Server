<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Noob Server</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 1200px; 
      margin: 50px auto; 
      background: #1a1a1a; 
      color: white; 
    }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #444;
    }
    .tab {
      padding: 10px 20px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background: #007cba;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .user-list, .activity-panel { 
      background: #2a2a2a; 
      padding: 20px; 
      border-radius: 5px; 
      margin-bottom: 20px; 
    }
    .user-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px; 
      border-bottom: 1px solid #444; 
    }
    .form-group { 
      margin-bottom: 15px; 
    }
    input, textarea, select { 
      width: 100%; 
      padding: 8px; 
      margin-top: 5px; 
      background: #333; 
      color: white; 
      border: 1px solid #555; 
    }
    button { 
      padding: 8px 15px; 
      background: #007cba; 
      color: white; 
      border: none; 
      cursor: pointer; 
      margin: 5px; 
    }
    .delete-btn { 
      background: #dc3545; 
    }
    .restrict-btn {
      background: #dc3545;
    }
    .activate-btn {
      background: #28a745;
    }
    .message-btn {
      background: #28a745;
    }
    .refresh-btn {
      background: #ffc107;
      color: black;
    }
    .add-user { 
      background: #2a2a2a; 
      padding: 20px; 
      border-radius: 5px; 
    }
    .status-active { color: #28a745; }
    .status-inactive { color: #dc3545; }
    .message-form {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 5px;
      margin-top: 20px;
      display: none;
    }
    .activity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .message-item {
      background: #333;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 3px solid #007cba;
    }
    .message-meta {
      font-size: 0.9em;
      color: #aaa;
      margin-top: 8px;
    }
    .unread {
      border-left-color: #28a745;
      background: #2a3d2a;
    }
    .message-content {
      margin: 10px 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Admin Panel</h1>
    <div>
      <span id="adminName"></span>
      <button onclick="goHome()">Back to Home</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('users', event)">User Management</button>
    <button class="tab" onclick="showTab('activity', event)">User Activity</button>
    <button class="tab" onclick="showTab('messages', event)">Messages</button>
  </div>

  <!-- USER MANAGEMENT TAB -->
  <div id="users" class="tab-content active">
    <div class="user-list">
      <h2>Current Users</h2>
      <div id="usersList"></div>
    </div>
    <div class="add-user">
      <h2>Add New User</h2>
      <form id="addUserForm">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" id="newUsername" required>
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" id="newPassword" required>
        </div>
        <button type="submit">Add User</button>
      </form>
    </div>
  </div>

  <!-- ACTIVITY TAB -->
  <div id="activity" class="tab-content">
    <div class="activity-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>User Activity Monitor</h2>
        <button class="refresh-btn" onclick="loadActivity()">Refresh Activity</button>
      </div>
      <div class="activity-grid">
        <div>
          <h3>Active Users (<span id="activeCount">0</span>)</h3>
          <div id="activeUsersList"></div>
        </div>
        <div>
          <h3>Database Activity</h3>
          <div id="dbActivityList"></div>
        </div>
      </div>
    </div>
    <div class="message-form" id="messageForm">
      <h3>Send Message to <span id="targetUser"></span></h3>
      <div class="form-group">
        <textarea id="messageText" placeholder="Enter your message..." rows="4"></textarea>
      </div>
      <button onclick="sendMessage()">Send Message</button>
      <button onclick="closeMessageForm()">Cancel</button>
    </div>
  </div>

  <!-- MESSAGES TAB -->
  <div id="messages" class="tab-content">
    <div class="activity-panel">
      <h2>Send Message to User</h2>
      <div class="form-group">
        <label>Select User:</label>
        <select id="messageRecipient">
          <option value="">Select a user...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Message:</label>
        <textarea id="messageContent" placeholder="Enter your message..." rows="4"></textarea>
      </div>
      <button onclick="sendDirectMessage()">Send Message</button>
    </div>
    <div class="activity-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>Recent Messages</h2>
        <button class="refresh-btn" onclick="loadMessageHistory()">Refresh Messages</button>
      </div>
      <div id="messageHistory"></div>
    </div>
  </div>

  <div id="message"></div>

  <script>
    let selectedUserId = null;
    let selectedUsername = null;

    // verify admin logged in
    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
    const username = sessionStorage.getItem('username');
    if (!isLoggedIn || username !== 'admin') {
      alert('Access denied. Admin login required.');
      window.location.href = '/login.html';
    } else {
      document.getElementById('adminName').textContent = 'Welcome, ' + username;
      loadUsers();
    }

    function showTab(tabName, event) {
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'activity') {
        loadActivity();
      } else if (tabName === 'messages') {
        loadUsersForMessaging();
        loadMessageHistory();
      }
    }

    async function loadUsers() {
      try {
        const resp = await fetch('/.netlify/functions/admin', { method: 'GET' });
        const data = await resp.json();
        if (data.success) {
          displayUsers(data.users);
        }
      } catch (err) {
        console.error('Error loading users:', err);
      }
    }

    function displayUsers(users) {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      users.forEach(user => {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-item';
        const statusText = user.is_active ? 'Active' : 'Restricted';
        const statusColor = user.is_active ? '#28a745' : '#dc3545';
        userDiv.innerHTML = `
          <span>ID: ${user.id} | Username: ${user.username} | Status: <span style="color: ${statusColor}">${statusText}</span></span>
          <div>
            <button onclick="editUser(${user.id}, '${user.username}', ${user.is_active})">Edit</button>
            <button onclick="toggleUserAccess(${user.id}, ${user.is_active})" class="${user.is_active ? 'restrict-btn' : 'activate-btn'}">${user.is_active ? 'Restrict Access' : 'Restore Access'}</button>
            <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
          </div>
        `;
        list.appendChild(userDiv);
      });
    }

    async function loadActivity() {
      try {
        const resp = await fetch('/.netlify/functions/getActiveUsers');
        const data = await resp.json();
        if (data.activeUsers) {
          displayActiveUsers(data.activeUsers);
          document.getElementById('activeCount').textContent = data.activeUsers.length;
        }
        // you could also fetch DB activity via another endpoint if you have one
      } catch (err) {
        console.error('Error loading activity:', err);
      }
    }

    function displayActiveUsers(users) {
      const container = document.getElementById('activeUsersList');
      container.innerHTML = '';
      if (users.length === 0) {
        container.innerHTML = '<p>No active users</p>';
        return;
      }
      users.forEach(user => {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-item';
        const lastActivity = new Date(user.last_activity).toLocaleString();
        userDiv.innerHTML = `
          <div>
            <strong>${user.username || user.user_id}</strong><br>
            <small>Last active: ${lastActivity}</small>
          </div>
          <div>
            <button class="message-btn" onclick="openMessageForm(${user.user_id}, '${user.username}')">Send Message</button>
          </div>
        `;
        container.appendChild(userDiv);
      });
    }

    function displayDbActivity(activity) {
      const container = document.getElementById('dbActivityList');
      container.innerHTML = '';
      // If you have DB activity endpoint, fill this in similarly
      container.innerHTML = '<p>No database activity available</p>';
    }

    async function loadUsersForMessaging() {
      try {
        const resp = await fetch('/.netlify/functions/admin', { method: 'GET' });
        const data = await resp.json();
        if (data.success && data.users) {
          const select = document.getElementById('messageRecipient');
          select.innerHTML = '<option value="">Select a user...</option>';
          data.users.forEach(user => {
            select.innerHTML += `<option value="${user.id}">${user.username}</option>`;
          });
        }
      } catch (err) {
        console.error('Error loading users for messaging:', err);
      }
    }

    async function loadMessageHistory() {
      try {
        const resp = await fetch('/.netlify/functions/messages', { method: 'GET' });
        const data = await resp.json();
        if (data.success) {
          displayMessageHistory(data.messages);
        }
      } catch (err) {
        console.error('Error loading message history:', err);
      }
    }

    function displayMessageHistory(messages) {
      const container = document.getElementById('messageHistory');
      container.innerHTML = '';
      if (messages.length === 0) {
        container.innerHTML = '<p>No messages found</p>';
        return;
      }
      messages.forEach(msg => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-item ${msg.read_at ? '' : 'unread'}`;
        const timestamp = new Date(msg.created_at).toLocaleString();
        const readStatus = msg.read_at ? 'Read' : 'Unread';
        messageDiv.innerHTML = `
          <div>
            <strong>To: ${msg.recipient_username}</strong>
            <div class="message-content">${msg.message}</div>
            <div class="message-meta">Sent: ${timestamp} | Status: ${readStatus}</div>
          </div>
        `;
        container.appendChild(messageDiv);
      });
    }

    function openMessageForm(userId, username) {
      selectedUserId = userId;
      selectedUsername = username;
      document.getElementById('targetUser').textContent = username;
      document.getElementById('messageForm').style.display = 'block';
      document.getElementById('messageText').focus();
    }

    function closeMessageForm() {
      document.getElementById('messageForm').style.display = 'none';
      document.getElementById('messageText').value = '';
      selectedUserId = null;
      selectedUsername = null;
    }

    async function sendMessage() {
      const message = document.getElementById('messageText').value.trim();
      if (!message || !selectedUserId) {
        alert('Please enter a message and select a user');
        return;
      }
      try {
        const resp = await fetch('/.netlify/functions/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send_message',
            userId: selectedUserId,
            message: message
          })
        });
        const data = await resp.json();
        if (data.success) {
          document.getElementById('message').innerHTML = `<p style="color: green;">Message sent to ${selectedUsername}!</p>`;
          closeMessageForm();
          loadActivity();
        } else {
          document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
      }
    }

    async function sendDirectMessage() {
      const recipientId = document.getElementById('messageRecipient').value;
      const message = document.getElementById('messageContent').value.trim();
      if (!recipientId || !message) {
        alert('Select a user and enter a message.');
        return;
      }
      try {
        const resp = await fetch('/.netlify/functions/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send', recipientId, message })
        });
        const data = await resp.json();
        if (data.success) {
          document.getElementById('message').innerHTML = `<p style="color: green;">Message sent!</p>`;
          document.getElementById('messageContent').value = '';
          loadMessageHistory();
        } else {
          document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
      }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const un = document.getElementById('newUsername').value;
      const pw = document.getElementById('newPassword').value;
      try {
        const resp = await fetch('/.netlify/functions/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', username: un, password: pw })
        });
        const data = await resp.json();
        if (data.success) {
          document.getElementById('message').innerHTML = '<p style="color: green;">User added successfully!</p>';
          document.getElementById('addUserForm').reset();
          loadUsers();
        } else {
          document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${data.message}</p>`;
        }
      } catch (err) {
        document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
      }
    });

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const resp = await fetch('/.netlify/functions/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', userId })
        });
        const data = await resp.json();
        if (data.success) {
          document.getElementById('message').innerHTML = '<p style="color: green;">User deleted successfully!</p>';
          loadUsers();
        }
      } catch (err) {
        console.error('Error deleting user:', err);
      }
    }

    function editUser(userId, currentUsername, isActive) {
      const newUsername = prompt('Enter new username:', currentUsername);
      if (!newUsername || newUsername === currentUsername) return;
      const changePW = confirm('Change password?');
      let newPassword = null;
      if (changePW) {
        newPassword = prompt('Enter new password:');
        if (!newPassword) return;
      }
      updateUser(userId, newUsername, newPassword, isActive);
    }

    async function toggleUserAccess(userId, currentStatus) {
      const confirmMsg = `Are you sure you want to ${currentStatus ? 'restrict' : 'restore'} access for this user?`;
      if (!confirm(confirmMsg)) return;
      try {
        const resp = await fetch('/.netlify/functions/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'toggle_access', userId, is_active: !currentStatus })
        });
        const data = await resp.json();
        if (data.success) {
          document.getElementById('message').innerHTML = `<p style="color: green;">Access updated!</p>`;
          loadUsers();
        } else {
          document.getElementById('message').innerHTML = `<p style="color: red;">Error: ${data.message}</p>`;
        }
      } catch (err) {
        console.error('Error toggling access:', err);
      }
    }

    function goHome() {
      window.location.href = '/index.html';
    }

    function logout() {
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('username');
      window.location.href = '/login.html';
    }

    // auto‑refresh
    setInterval(() => {
      if (document.getElementById('activity').classList.contains('active')) {
        loadActivity();
      } else if (document.getElementById('messages').classList.contains('active')) {
        loadMessageHistory();
      }
    }, 30000);
  </script>
</body>
</html>
