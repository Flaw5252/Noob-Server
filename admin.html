<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Noob Server</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 1200px; 
      margin: 50px auto; 
      background: #1a1a1a; 
      color: white; 
    }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #444;
    }
    .tab {
      padding: 10px 20px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background: #007cba;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .user-list, .activity-panel { 
      background: #2a2a2a; 
      padding: 20px; 
      border-radius: 5px; 
      margin-bottom: 20px; 
    }
    .user-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px; 
      border-bottom: 1px solid #444; 
    }
    .form-group { 
      margin-bottom: 15px; 
    }
    input, textarea, select { 
      width: 100%; 
      padding: 8px; 
      margin-top: 5px; 
      background: #333; 
      color: white; 
      border: 1px solid #555; 
    }
    button { 
      padding: 8px 15px; 
      background: #007cba; 
      color: white; 
      border: none; 
      cursor: pointer; 
      margin: 5px; 
    }
    .delete-btn { 
      background: #dc3545; 
    }
    .restrict-btn {
      background: #dc3545;
    }
    .activate-btn {
      background: #28a745;
    }
    .message-btn {
      background: #28a745;
    }
    .refresh-btn {
      background: #ffc107;
      color: black;
    }
    .add-user { 
      background: #2a2a2a; 
      padding: 20px; 
      border-radius: 5px; 
    }
    .status-active { color: #28a745; }
    .status-inactive { color: #dc3545; }
    .message-form {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 5px;
      margin-top: 20px;
      display: none;
    }
    .activity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    /* NEW CSS FOR MESSAGING SYSTEM */
    .message-item {
      background: #333;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 3px solid #007cba;
    }
    .message-meta {
      font-size: 0.9em;
      color: #aaa;
      margin-top: 8px;
    }
    .unread {
      border-left-color: #28a745;
      background: #2a3d2a;
    }
    .message-content {
      margin: 10px 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Admin Panel</h1>
    <div>
      <span id="adminName"></span>
      <button onclick="goHome()">Back to Home</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Tab Navigation - UPDATED -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('users')">User Management</button>
    <button class="tab" onclick="showTab('activity')">User Activity</button>
    <button class="tab" onclick="showTab('messages')">Messages</button>
  </div>

  <!-- User Management Tab -->
  <div id="users" class="tab-content active">
    <div class="user-list">
      <h2>Current Users</h2>
      <div id="usersList"></div>
    </div>

    <div class="add-user">
      <h2>Add New User</h2>
      <form id="addUserForm">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" id="newUsername" required>
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" id="newPassword" required>
        </div>
        <button type="submit">Add User</button>
      </form>
    </div>
  </div>

  <!-- User Activity Tab -->
  <div id="activity" class="tab-content">
    <div class="activity-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>User Activity Monitor</h2>
        <button class="refresh-btn" onclick="loadActivity()">Refresh Activity</button>
      </div>
      
      <div class="activity-grid">
        <div>
          <h3>Active Users (<span id="activeCount">0</span>)</h3>
          <div id="activeUsersList"></div>
        </div>
        
        <div>
          <h3>Database Activity</h3>
          <div id="dbActivityList"></div>
        </div>
      </div>
    </div>

    <div class="message-form" id="messageForm">
      <h3>Send Message to <span id="targetUser"></span></h3>
      <div class="form-group">
        <textarea id="messageText" placeholder="Enter your message..." rows="4"></textarea>
      </div>
      <button onclick="sendMessage()">Send Message</button>
      <button onclick="closeMessageForm()">Cancel</button>
    </div>
  </div>

  <!-- NEW MESSAGES TAB -->
  <div id="messages" class="tab-content">
    <div class="activity-panel">
      <h2>Send Message to User</h2>
      <div class="form-group">
        <label>Select User:</label>
        <select id="messageRecipient">
          <option value="">Select a user...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Message:</label>
        <textarea id="messageContent" placeholder="Enter your message..." rows="4"></textarea>
      </div>
      <button onclick="sendDirectMessage()">Send Message</button>
    </div>
    
    <div class="activity-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>Recent Messages</h2>
        <button class="refresh-btn" onclick="loadMessageHistory()">Refresh Messages</button>
      </div>
      <div id="messageHistory"></div>
    </div>
  </div>

  <div id="message"></div>
    <script>
    let selectedUserId = null;
    let selectedUsername = null;

    // Check if admin is logged in
    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
    const username = sessionStorage.getItem('username');

    if (!isLoggedIn || username !== 'admin') {
      alert('Access denied. Admin login required.');
      window.location.href = '/login.html';
    } else {
      document.getElementById('adminName').textContent = 'Welcome, ' + username;
      loadUsers();
    }

    // Tab Management - UPDATED
    function showTab(tabName) {
      // Hide all tab contents
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      
      // Remove active class from all tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Show selected tab content
      document.getElementById(tabName).classList.add('active');
      
      // Add active class to clicked tab
      event.target.classList.add('active');
      
      // Load data when specific tabs are selected - UPDATED
      if (tabName === 'activity') {
        loadActivity();
      } else if (tabName === 'messages') {
        loadUsersForMessaging();
        loadMessageHistory();
      }
    }

    // Load users function using Neon serverless driver pattern
    async function loadUsers() {
      try {
        const response = await fetch('/.netlify/functions/admin', {
          method: 'GET'
        });
        const data = await response.json();
        
        if (data.success) {
          displayUsers(data.users);
        }
      } catch (error) {
        console.error('Error loading users:', error);
      }
    }

    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '';
      
      users.forEach(user => {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-item';
        const statusText = user.is_active ? 'Active' : 'Restricted';
        const statusColor = user.is_active ? 'green' : 'red';
        
        userDiv.innerHTML = `
          <span>ID: ${user.id} | Username: ${user.username} | 
            Status: <span style="color: ${statusColor}">${statusText}</span>
          </span>
          <div>
            <button onclick="editUser(${user.id}, '${user.username}', ${user.is_active})">Edit</button>
            <button onclick="toggleUserAccess(${user.id}, ${user.is_active})" 
                    class="${user.is_active ? 'restrict-btn' : 'activate-btn'}">
              ${user.is_active ? 'Restrict Access' : 'Restore Access'}
            </button>
            <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
          </div>
        `;
        usersList.appendChild(userDiv);
      });
    }

    // Activity monitoring functions using Neon serverless driver pattern
    async function loadActivity() {
      try {
        const response = await fetch('/.netlify/functions/user-activity');
        const data = await response.json();
        
        if (data.success) {
          displayActiveUsers(data.activeUsers);
          displayDbActivity(data.dbActivity);
          document.getElementById('activeCount').textContent = data.totalActive;
        }
      } catch (error) {
        console.error('Error loading activity:', error);
      }
    }

    function displayActiveUsers(users) {
      const container = document.getElementById('activeUsersList');
      container.innerHTML = '';
      
      users.forEach(user => {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-item';
        
        const lastActivity = new Date(user.last_activity).toLocaleString();
        const unreadCount = user.unread_messages > 0 ? ` (${user.unread_messages} unread)` : '';
        
        userDiv.innerHTML = `
          <div>
            <strong>${user.username}</strong><br>
            <small>Last active: ${lastActivity}${unreadCount}</small>
          </div>
          <div>
            <button class="message-btn" onclick="openMessageForm(${user.id}, '${user.username}')">
              Send Message
            </button>
          </div>
        `;
        container.appendChild(userDiv);
      });
      
      if (users.length === 0) {
        container.innerHTML = '<p>No active users found</p>';
      }
    }

    function displayDbActivity(activity) {
      const container = document.getElementById('dbActivityList');
      container.innerHTML = '';
      
      activity.forEach(item => {
        const activityDiv = document.createElement('div');
        activityDiv.className = 'user-item';
        
        const queryStart = new Date(item.query_start).toLocaleString();
        
        activityDiv.innerHTML = `
          <div>
            <strong>${item.username}</strong><br>
            <small>State: <span class="status-active">${item.state}</span><br>
            Query started: ${queryStart}</small>
          </div>
        `;
        container.appendChild(activityDiv);
      });
      
      if (activity.length === 0) {
        container.innerHTML = '<p>No active database queries</p>';
      }
    }

    // Send direct message from Messages tab
    async function sendDirectMessage() {
      const recipientId = document.getElementById('messageRecipient').value;
      const message = document.getElementById('messageContent').value.trim();
      
      if (!recipientId || !message) {
        alert('Please select a user and enter a message');
        return;
      }
      
      try {
        const response = await fetch('/.netlify/functions/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send',
            recipientId: recipientId,
            message: message
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('message').innerHTML = 
            '<p style="color: green;">Message sent successfully!</p>';
          document.getElementById('messageContent').value = '';
          loadMessageHistory();
        } else {
          document.getElementById('message').innerHTML = 
            '<p style="color: red;">Error: ' + data.error + '</p>';
        }
      } catch (error) {
        document.getElementById('message').innerHTML = 
          '<p style="color: red;">Error: ' + error.message + '</p>';
      }
    }

    // Load message history
    async function loadMessageHistory() {
      try {
        const response = await fetch('/.netlify/functions/messages', {
          method: 'GET'
        });
        const data = await response.json();
        
        if (data.success) {
          displayMessageHistory(data.messages);
        }
      } catch (error) {
        console.error('Error loading message history:', error);
      }
    }

    function displayMessageHistory(messages) {
      const container = document.getElementById('messageHistory');
      container.innerHTML = '';
      
      messages.forEach(message => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-item ${message.read_at ? '' : 'unread'}`;
        
        const timestamp = new Date(message.created_at).toLocaleString();
        const readStatus = message.read_at ? 'Read' : 'Unread';
        
        messageDiv.innerHTML = `
          <div>
            <strong>To: ${message.recipient_username}</strong>
            <div class="message-content">${message.message}</div>
            <div class="message-meta">Sent: ${timestamp} | Status: ${readStatus}</div>
          </div>
        `;
        container.appendChild(messageDiv);
      });
      
      if (messages.length === 0) {
        container.innerHTML = '<p>No messages found</p>';
      }
    }
        // Message form functions (existing - from Activity tab)
    function openMessageForm(userId, username) {
      selectedUserId = userId;
      selectedUsername = username;
      document.getElementById('targetUser').textContent = username;
      document.getElementById('messageForm').style.display = 'block';
      document.getElementById('messageText').focus();
    }

    function closeMessageForm() {
      document.getElementById('messageForm').style.display = 'none';
      document.getElementById('messageText').value = '';
      selectedUserId = null;
      selectedUsername = null;
    }

    async function sendMessage() {
      const message = document.getElementById('messageText').value.trim();
      
      if (!message) {
        alert('Please enter a message');
        return;
      }
      
      try {
        const response = await fetch('/.netlify/functions/user-activity', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send_message',
            userId: selectedUserId,
            message: message
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('message').innerHTML = 
            `<p style="color: green;">Message sent to ${selectedUsername}!</p>`;
          closeMessageForm();
          loadActivity();
        } else {
          document.getElementById('message').innerHTML = 
            `<p style="color: red;">Error sending message: ${data.error}</p>`;
        }
      } catch (error) {
        document.getElementById('message').innerHTML = 
          `<p style="color: red;">Error sending message: ${error.message}</p>`;
      }
    }

    // Existing user management functions
    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;
      
      try {
        const response = await fetch('/.netlify/functions/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('message').innerHTML = 
            '<p style="color: green;">User added successfully!</p>';
          document.getElementById('addUserForm').reset();
          loadUsers();
        } else {
          document.getElementById('message').innerHTML = 
            '<p style="color: red;">Error: ' + data.message + '</p>';
        }
      } catch (error) {
        document.getElementById('message').innerHTML = 
          '<p style="color: red;">Error: ' + error.message + '</p>';
      }
    });

    async function deleteUser(userId) {
      if (confirm('Are you sure you want to delete this user?')) {
        try {
          const response = await fetch('/.netlify/functions/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', userId })
          });
          
          const data = await response.json();
          
          if (data.success) {
            document.getElementById('message').innerHTML = 
              '<p style="color: green;">User deleted successfully!</p>';
            loadUsers();
          }
        } catch (error) {
          console.error('Error deleting user:', error);
        }
      }
    }

    function editUser(userId, currentUsername, isActive) {
      const newUsername = prompt('Enter new username:', currentUsername);
      
      if (newUsername && newUsername !== currentUsername) {
        const changePassword = confirm('Do you want to change the password?');
        let newPassword = null;
        
        if (changePassword) {
          newPassword = prompt('Enter new password:');
          if (!newPassword) return;
        }
        
        updateUser(userId, newUsername, newPassword, isActive);
      }
    }

    async function toggleUserAccess(userId, currentStatus) {
      const action = currentStatus ? 'restrict access for' : 'restore access for';
      const confirmMessage = `Are you sure you want to ${action} this user?`;
        
      if (confirm(confirmMessage)) {
        try {
          const response = await fetch('/.netlify/functions/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              action: 'toggle_access', 
              userId: userId, 
              isActive: !currentStatus 
            })
          });
          
          const data = await response.json();
          
          if (data.success) {
            const actionText = currentStatus ? 'restricted' : 'restored';
            document.getElementById('message').innerHTML = 
              `<p style="color: green;">User access ${actionText} successfully!</p>`;
            loadUsers();
          } else {
            document.getElementById('message').innerHTML = 
              `<p style="color: red;">Error: ${data.message}</p>`;
          }
        } catch (error) {
          document.getElementById('message').innerHTML = 
            `<p style="color: red;">Error: ${error.message}</p>`;
        }
      }
    }

    async function updateUser(userId, username, password, isActive) {
      try {
        const updateData = { 
          action: 'update', 
          userId, 
          username, 
          isActive 
        };
        
        if (password) {
          updateData.password = password;
        }

        const response = await fetch('/.netlify/functions/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });
        
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('message').innerHTML = 
            '<p style="color: green;">User updated successfully!</p>';
          loadUsers();
        } else {
          document.getElementById('message').innerHTML = 
            '<p style="color: red;">Error: ' + data.message + '</p>';
        }
      } catch (error) {
        console.error('Error updating user:', error);
        document.getElementById('message').innerHTML = 
          '<p style="color: red;">Error: ' + error.message + '</p>';
      }
    }

    function goHome() {
      window.location.href = '/index.html';
    }

    function logout() {
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('username');
      window.location.href = '/login.html';
    }

    // Auto-refresh activity every 30 seconds when on activity tab - UPDATED
    setInterval(() => {
      if (document.getElementById('activity').classList.contains('active')) {
        loadActivity();
      } else if (document.getElementById('messages').classList.contains('active')) {
        loadMessageHistory(); // Also refresh messages tab
      }
    }, 30000);
  </script>
</body>
</html>
