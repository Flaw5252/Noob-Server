<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Noob Server</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 1200px; 
      margin: 50px auto; 
      background: #1a1a1a; 
      color: white; 
    }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #444;
    }
    .tab {
      padding: 10px 20px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background: #007cba;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .user-list, .activity-panel { 
      background: #2a2a2a; 
      padding: 20px; 
      border-radius: 5px; 
      margin-bottom: 20px; 
    }
    .user-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px; 
      border-bottom: 1px solid #444; 
    }
    .form-group { 
      margin-bottom: 15px; 
    }
    input, textarea { 
      width: 100%; 
      padding: 8px; 
      margin-top: 5px; 
      background: #333; 
      color: white; 
      border: 1px solid #555; 
    }
    button { 
      padding: 8px 15px; 
      background: #007cba; 
      color: white; 
      border: none; 
      cursor: pointer; 
      margin: 5px; 
    }
    .delete-btn { 
      background: #dc3545; 
    }
    .restrict-btn {
      background: #dc3545;
    }
    .activate-btn {
      background: #28a745;
    }
    .message-btn {
      background: #28a745;
    }
    .refresh-btn {
      background: #ffc107;
      color: black;
    }
    .add-user { 
      background: #2a2a2a; 
      padding: 20px; 
      border-radius: 5px; 
    }
    .status-active { color: #28a745; }
    .status-inactive { color: #dc3545; }
    .message-form {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 5px;
      margin-top: 20px;
      display: none;
    }
    .activity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Admin Panel</h1>
    <div>
      <span id="adminName"></span>
      <button onclick="goHome()">Back to Home</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('users')">User Management</button>
    <button class="tab" onclick="showTab('activity')">User Activity</button>
  </div>

  <!-- User Management Tab -->
  <div id="users" class="tab-content active">
    <div class="user-list">
      <h2>Current Users</h2>
      <div id="usersList"></div>
    </div>

    <div class="add-user">
      <h2>Add New User</h2>
      <form id="addUserForm">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" id="newUsername" required>
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" id="newPassword" required>
        </div>
        <button type="submit">Add User</button>
      </form>
    </div>
  </div>

  <!-- User Activity Tab -->
  <div id="activity" class="tab-content">
    <div class="activity-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>User Activity Monitor</h2>
        <button class="refresh-btn" onclick="loadActivity()">Refresh Activity</button>
      </div>
      
      <div class="activity-grid">
        <div>
          <h3>Active Users (<span id="activeCount">0</span>)</h3>
          <div id="activeUsersList"></div>
        </div>
        
        <div>
          <h3>Database Activity</h3>
          <div id="dbActivityList"></div>
        </div>
      </div>
    </div>

    <div class="message-form" id="messageForm">
      <h3>Send Message to <span id="targetUser"></span></h3>
      <div class="form-group">
        <textarea id="messageText" placeholder="Enter your message..." rows="4"></textarea>
      </div>
      <button onclick="sendMessage()">Send Message</button>
      <button onclick="closeMessageForm()">Cancel</button>
    </div>
  </div>

  <div id="message"></div>
