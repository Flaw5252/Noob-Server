<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="V1 of Noob Server! click now!">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/fb203351e2.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Noob Server | v1</title>
  <script src="particles.min.js"></script>
</head>
<body>
  <div class="dropdown">
    <button class="dropbtn">☰</button>
    <div class="dropdown-content">
      <a href="index.html">
        <i class="fa fa-fw fa-home"></i> Home 
      </a>
      <a href="collection.html">
        <i class="fa fa-fw fa-gamepad"></i> Games 
      </a>
      <a href="admin.html" id="adminLink">
        <i class="fa fa-fw fa-cog"></i> Admin Panel 
      </a>
      <a href="#" onclick="logout()">
        <i class="fa fa-fw fa-sign-out"></i> Logout 
      </a>
    </div>
  </div>

  <div class="title">
    <a>N</a><a>o</a><a>o</a><a>b</a><a>&nbsp</a><a>S</a><a>e</a><a>r</a><a>v</a><a>e</a><a>r</a>
  </div>

  <!-- Add welcome message -->
  <div id="welcome-message" style="text-align: center; margin-top: 20px; color: white;"></div>

  <script>
    // Use sessionStorage instead of localStorage
    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
    const username = sessionStorage.getItem('username');

    console.log('Logged in:', isLoggedIn);
    console.log('Username:', username);

    if (!isLoggedIn) {
        window.location.href = '/login.html';
    } else {
        // Show welcome message
        document.getElementById('welcome-message').innerHTML = 'Welcome back, ' + username + '!';
        
        // Show admin link only for admin user
        const adminLink = document.getElementById('adminLink');
        if (username === 'admin') {
          console.log('Admin user detected - showing admin link');
          adminLink.style.display = 'block';
          adminLink.style.color = '#ff0000'; // Make it red so it's visible
        } else {
          console.log('Non-admin user - hiding admin link');
          adminLink.style.display = 'none';
        }
    }

    function logout() {
        sessionStorage.removeItem('isLoggedIn');
        sessionStorage.removeItem('username');
        window.location.href = '/login.html';
    }
  </script>
  
  <script>
// Add this to track user activity
const username = sessionStorage.getItem('username');
if (username) {
    const currentPage = window.location.pathname;
    
    // Track initial page load
    fetch('/.netlify/functions/track-activity', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, currentPage })
    });
    
    // Update activity every 2 minutes
    setInterval(() => {
        fetch('/.netlify/functions/track-activity', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, currentPage })
        });
    }, 120000);
}
</script>
  
</body>
</html>
